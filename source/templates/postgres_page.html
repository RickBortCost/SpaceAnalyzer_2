<main class="pg-page" id="pg-page" hidden="">

<p class="small" id="pg-error" role="alert" hidden=""></p>

</details>
<div class="pg-catalog-tools">

</div>
<div class="toolbar"><button class="primary" id="pg-load" type="button" data-i18n="Apri nel grafico">Apri nel grafico</button><button class="ghost" id="pg-clear-selection" type="button" data-i18n="Deseleziona">Deseleziona</button><button class="ghost" id="pg-export-open" type="button" title="Esporta i dati originali delle serie del grafico in CSV, Parquet, FDA o RBF" data-i18n="Esporta…" data-i18n-title="Esporta i dati originali delle serie del grafico in CSV, Parquet, FDA o RBF">Esporta…</button></div>

<label class="pg-export-choice"><input name="pg-export-period" type="radio" value="visible"><span><span data-i18n="Intervallo visibile nel grafico">Intervallo visibile nel grafico</span> <small id="pg-export-visible-range"></small></span></label>

</div>
