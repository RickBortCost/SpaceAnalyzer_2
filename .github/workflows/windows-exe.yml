name: Build and publish Windows EXE

on:
  push:
    branches: [main]
    paths:
      - source/**
      - tools/windows/**
      - LEGGIMI_AVVIO_WINDOWS.md
      - .github/workflows/windows-exe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify overlapping recordings, original intervals and catalog navigation
        shell: pwsh
        run: |
          python -m pip install -r source/requirements.txt python-snap7==2.0.2 *> windows-catalog-install.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-catalog-install.log -Tail 80; exit $LASTEXITCODE }
          $uiDeps = Join-Path $env:RUNNER_TEMP 'space-analyzer-ui'
          npm install --prefix $uiDeps --no-audit --no-fund jsdom@30.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s source/tests -p test_live_interval_calculations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s source/tests -p test_acquisition_hardening.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s source/tests -p test_mqtt_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s source/tests -p test_recording_manager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s source/tests -p test_recording_preview.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:JSDOM_PATH = Join-Path $uiDeps 'node_modules/jsdom'
          python source/tests/test_source_sessions_ui_harness.py *> windows-catalog-ui.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-catalog-ui.log -Tail 100; exit $LASTEXITCODE }
          Get-Content windows-catalog-ui.log
          $env:UI_SCRIPT = 'test_live_zoom_ui.cjs'
          python source/tests/test_source_sessions_ui_harness.py *> windows-live-zoom-ui.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-live-zoom-ui.log -Tail 100; exit $LASTEXITCODE }
          Get-Content windows-live-zoom-ui.log
          $env:UI_SCRIPT = 'test_live_interval_ui.cjs'
          python source/tests/test_source_sessions_ui_harness.py *> windows-interval-ui.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-interval-ui.log -Tail 100; exit $LASTEXITCODE }
          Get-Content windows-interval-ui.log
          $env:UI_SCRIPT = 'test_recording_overlap_ui.cjs'
          python source/tests/test_source_sessions_ui_harness.py *> windows-overlap-ui.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-overlap-ui.log -Tail 100; exit $LASTEXITCODE }
          Get-Content windows-overlap-ui.log
          Remove-Item Env:UI_SCRIPT
      - name: Build standalone EXE with current sources
        shell: pwsh
        run: |
          python source/build_windows.py *> windows-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-build.log -Tail 80; exit $LASTEXITCODE }
      - name: Execute the packaged Windows application and verify recordings
        shell: pwsh
        run: |
          python tools/windows/smoke_exe.py --exe source/dist/Space_Analyzer_V1.29.0.exe --report source/dist/WINDOWS_EXE_VERIFICATION.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create portable Windows ZIP and checksums
        shell: pwsh
        run: |
          python tools/windows/package_windows.py --dist source/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Space-Analyzer-Windows-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            windows-build.log
            windows-catalog-ui.log
            windows-live-zoom-ui.log
            windows-interval-ui.log
            windows-overlap-ui.log
            windows-catalog-install.log
            source/dist/*.exe
            source/dist/*.zip
            source/dist/*.json
            source/dist/SHA256SUMS.txt
      - name: Publish verified Windows files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.29.0'
          $files = @('source/dist/Space_Analyzer_V1.29.0.exe', 'source/dist/Space_Analyzer_V1.29.0_WINDOWS.zip', 'source/dist/BUILD_MANIFEST.json', 'source/dist/WINDOWS_EXE_VERIFICATION.json', 'source/dist/SHA256SUMS.txt')
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --title 'Space Analyzer V1.29.0 — Windows x64' --notes-file LEGGIMI_AVVIO_WINDOWS.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
