name: Build and publish Space Analyzer (Windows EXE)

on:
  push:
    branches: [main]
    paths:
      - source/**
      - tools/windows/**
      - LEGGIMI_AVVIO_WINDOWS.md
      - VERSION
      - .github/workflows/windows-exe.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un solo rilascio alla volta su main: due esecuzioni non possono calcolare la stessa versione.
concurrency:
  group: windows-exe-${{ github.event_name == 'pull_request' && github.ref || 'main-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # servono tutti i tag per calcolare la versione
      # Python serve solo agli strumenti di build/test (versione, simulatori dei protocolli); il prodotto è interamente C#.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Determine version (tag Git + messaggi di commit)
        shell: pwsh
        run: |
          $version = python tools/versioning.py next
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/versioning.py apply $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "SA_VERSION=$version"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Versione calcolata: $version"
      - name: Build and unit-test the C# service and engine
        shell: pwsh
        run: |
          dotnet build source/app/SpaceAnalyzer/SpaceAnalyzer.csproj -c Release *> windows-dotnet-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-dotnet-build.log -Tail 80; exit $LASTEXITCODE }
          dotnet test source/engine/SpaceAnalyzer.Engine.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test source/app/SpaceAnalyzer.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: UI workflows (jsdom) against the C# service and local protocol peers
        shell: pwsh
        run: |
          python -m pip install -r source/tests/requirements-test.txt *> windows-test-install.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-test-install.log -Tail 80; exit $LASTEXITCODE }
          $uiDeps = Join-Path $env:RUNNER_TEMP 'space-analyzer-ui'
          npm install --prefix $uiDeps --no-audit --no-fund jsdom@30.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:JSDOM_PATH = Join-Path $uiDeps 'node_modules/jsdom'
          python -m unittest discover -s source/tests -p test_versioning.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s source/tests -p test_release_notes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/tests/test_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # test_s7_modes_ui.cjs richiede una CPU S7-1200/1500 reale (S7CommPlus autenticato): escluso dalla CI.
          $scripts = Get-ChildItem source/tests -Filter 'test_*.cjs' | Where-Object { $_.Name -ne 'test_s7_modes_ui.cjs' }
          foreach ($script in $scripts) {
            $env:UI_SCRIPT = $script.Name
            python source/tests/ui_harness_cs.py *> "windows-ui-$($script.BaseName).log"
            if ($LASTEXITCODE -ne 0) { Get-Content "windows-ui-$($script.BaseName).log" -Tail 100; exit $LASTEXITCODE }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $($script.Name): PASS"
          }
          Remove-Item Env:UI_SCRIPT
      - name: Build standalone EXE (Go launcher + self-contained .NET service)
        shell: pwsh
        run: |
          python tools/windows/build_windows.py *> windows-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content windows-build.log -Tail 80; exit $LASTEXITCODE }
      - name: Execute the packaged Windows application and verify recordings
        shell: pwsh
        run: |
          python tools/windows/smoke_exe.py --exe "source/dist/Space_Analyzer_V$($env:SA_VERSION).exe" --report source/dist/WINDOWS_EXE_VERIFICATION.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create portable Windows ZIP and checksums
        shell: pwsh
        run: |
          python tools/windows/package_windows.py --dist source/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Space-Analyzer-${{ env.SA_VERSION }}-Windows-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            windows-*.log
            source/dist/*.exe
            source/dist/*.zip
            source/dist/*.json
            source/dist/SHA256SUMS.txt
      - name: Publish verified Windows files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:SA_VERSION
          $tag = "v$v"
          $files = @("source/dist/Space_Analyzer_V$($v).exe", "source/dist/Space_Analyzer_V$($v)_WINDOWS.zip", 'source/dist/BUILD_MANIFEST.json', 'source/dist/WINDOWS_EXE_VERIFICATION.json', 'source/dist/SHA256SUMS.txt')
          # Testo della release: modifiche di questa versione (CHANGELOG o commit) e guida di avvio.
          python tools/release_notes.py notes $v release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --notes-file release-notes.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --title "Space Analyzer V$($v) — Windows x64" --notes-file release-notes.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
